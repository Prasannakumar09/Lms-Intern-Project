<div class="container mt-4">

  <div *ngIf="role === 'Admin' || role === 'mentor'" class="mb-5">
    <div class="poll-card create-poll">
      <h4>Create a Poll</h4>
      <form [formGroup]="pollForm" (ngSubmit)="createPoll()">
        <input formControlName="question" class="form-control mb-3" placeholder="Enter your question" />
        <div formArrayName="options">
          <div *ngFor="let opt of options.controls; let i = index" class="d-flex align-items-center mb-2">
            <input [formControlName]="i" class="form-control me-2" placeholder="Option {{ i + 1 }}" />
            <button *ngIf="options.length > 2" type="button" class="btn btn-danger btn-sm" (click)="removeOption(i)">✕</button>
          </div>
        </div>
        <button type="button" class="btn btn-outline-primary mb-3" (click)="addOption()">+ Add Option</button>
        <div class="form-check mb-3">
          <input type="checkbox" class="form-check-input" formControlName="multipleChoice" />
          <label class="form-check-label">Allow multiple choices</label>
        </div>
        <button type="submit" class="btn btn-primary w-100">Create Poll</button>
      </form>
    </div>
  </div>

  <div *ngFor="let poll of polls" class="poll-card mb-3">
  <div class="d-flex justify-content-between">
    <h5>{{ poll.question }}</h5>
    <span>{{poll.createdAt | date: 'MMM dd, yyyy' }}</span>
  </div>

  <div *ngFor="let opt of poll.options" class="option-card" [ngClass]="{'voted': isUserVotedOption(poll, opt)}">
    <label 
      class="option-label d-flex justify-content-between align-items-center"
      [title]="opt.votes + ' vote(s)'"  
    >
      <input
        type="{{ poll.multipleChoice ? 'checkbox' : 'radio' }}"
        [name]="poll._id"
        [value]="opt.optionId"
        (change)="toggleSelection(poll, opt.optionId)"
        [disabled]="role !== 'student' || poll.votedUser.includes(currentUserId)"
      />
      <span class="ms-2 flex-grow-1">{{ opt.text }}</span>
      <span class="percentage">{{ getPercentage(opt.votes, poll.options) }}%</span>
    </label>

    <div class="progress-bar">
      <div class="fill" [style.width.%]="getPercentage(opt.votes, poll.options)"></div>
    </div>
  </div>

  <div class="d-flex justify-content-between mt-2">
    <button 
      *ngIf="role === 'student' && !poll.votedUser.includes(currentUserId)" 
      class="btn btn-success w-100 me-1" 
      (click)="submitVote(poll._id)"
    >
      Vote
    </button>
    <button 
      *ngIf="role === 'mentor'|| role ==='Admin'" 
      class="btn btn-danger w-100 ms-1" 
      (click)="deletePoll(poll._id)"
    >
      Delete
    </button>
  </div>
</div>


</div>
