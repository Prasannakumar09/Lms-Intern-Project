<div class="add-user-container d-flex justify-content-center align-items-center">
  <div class="add-user-card rounded-4 p-4">
    <div class="text-center mb-4">
      <div class="enterprise-icon mb-3">
        <i class="bi bi-person-plus-fill"></i>
      </div>
      <h4 class="fw-bold text-dark">Add New User</h4>
      <p class="text-muted small">Create and assign roles for new team members</p>
    </div>

    <form [formGroup]="adduserform" (ngSubmit)="OnCreate()" class="enterprise-form">
      <div class="row g-3">
        <div class="col-12">
          <label for="username" class="form-label fw-semibold text-secondary">
            <i class="bi bi-person me-1 text-primary"></i> Full Name
          </label>
          <input
            type="text"
            id="username"
            formControlName="username"
            placeholder="Enter user's full name"
            class="form-control form-control-enterprise"
            [ngClass]="{
              'is-invalid':
                adduserform.get('username')?.touched &&
                adduserform.get('username')?.invalid
            }"
          />
        </div>

        <div class="col-12">
          <label for="email" class="form-label fw-semibold text-secondary">
            <i class="bi bi-envelope me-1 text-primary"></i> Email Address
          </label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="example@gmail.com"
            class="form-control form-control-enterprise"
            [ngClass]="{
              'is-invalid':
                adduserform.get('email')?.touched &&
                adduserform.get('email')?.invalid
            }"
          />
        </div>

        <div class="col-md-6">
          <label for="role" class="form-label fw-semibold text-secondary">
            <i class="bi bi-shield-check me-1 text-primary"></i> Role
          </label>
          <select
            id="role"
            class="form-select form-select-enterprise"
            formControlName="role"
          >
            <option value="" disabled selected>Choose a role</option>
            <option value="mentor">Mentor</option>
            <option value="student">Student</option>
          </select>
        </div>

        <div class="col-md-6">
          <label for="password" class="form-label fw-semibold text-secondary">
            <i class="bi bi-lock me-1 text-primary"></i> Password
          </label>
          <input
            type="password"
            id="password"
            formControlName="password"
            placeholder="Enter a secure password"
            class="form-control form-control-enterprise"
            [ngClass]="{
              'is-invalid':
                adduserform.get('password')?.touched &&
                adduserform.get('password')?.invalid
            }"
          />
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary w-100 mt-4 fw-semibold"
        [disabled]="adduserform.invalid"
      >
        <i class="bi bi-check-circle me-2"></i> Create User
      </button>
    </form>
  </div>
</div>
